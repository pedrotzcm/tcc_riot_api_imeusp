services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: riot
      POSTGRES_PASSWORD: riot
      POSTGRES_DB: riot_br
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riot -d riot_br"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
